name: Release Electron App

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: macos-latest
                      cmd: npx electron-builder --mac dmg --arm64 --x64 --publish always
                    - os: windows-latest
                      cmd: npx electron-builder --win nsis --x64 --publish always

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build and publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: ${{ matrix.cmd }}
