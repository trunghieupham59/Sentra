name: Release Production

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    id-token: write # Required for SignPath

jobs:
    create-release:
        runs-on: ubuntu-latest
        outputs:
            release_id: ${{ steps.create_release.outputs.id }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Generate release notes
              id: notes
              shell: bash
              run: |
                  CURRENT_TAG="${GITHUB_REF#refs/tags/}"
                  PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

                  echo "Current tag: $CURRENT_TAG"
                  echo "Previous tag: $PREV_TAG"

                  if [ -z "$PREV_TAG" ]; then
                    RAW_COMMITS=$(git log --pretty=format:"%s|%h|%an" HEAD)
                  else
                    RAW_COMMITS=$(git log --pretty=format:"%s|%h|%an" "${PREV_TAG}..HEAD")
                  fi

                  FEATURES=""
                  FIXES=""
                  IMPROVEMENTS=""
                  OTHER=""

                  while IFS='|' read -r subject hash author; do
                    [ -z "$subject" ] && continue
                    ENTRY="- ${subject} (\`${hash}\`) — *${author}*"
                    lower=$(echo "$subject" | tr '[:upper:]' '[:lower:]')
                    if echo "$lower" | grep -qE "^(feat|add|new|feature)"; then
                      FEATURES="${FEATURES}${ENTRY}"$'\n'
                    elif echo "$lower" | grep -qE "^(fix|bug|hotfix|patch|revert)"; then
                      FIXES="${FIXES}${ENTRY}"$'\n'
                    elif echo "$lower" | grep -qE "^(improve|enhance|update|refactor|perf|chore|style|docs|test|ci|build)"; then
                      IMPROVEMENTS="${IMPROVEMENTS}${ENTRY}"$'\n'
                    else
                      OTHER="${OTHER}${ENTRY}"$'\n'
                    fi
                  done <<< "$RAW_COMMITS"

                  TOTAL=$(echo "$RAW_COMMITS" | grep -c '.' || true)
                  COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"

                  {
                    echo "RELEASE_BODY<<ENDOFBODY"
                    echo "## T.R.E Assistant ${CURRENT_TAG} — Release Notes"
                    echo ""
                    echo "> **T.R.E Assistant** is a local AI-powered translation desktop app for macOS and Windows,"
                    echo "> supporting models from OpenAI, Anthropic Claude, and Google Gemini."
                    echo ""
                    echo "---"
                    echo ""

                    if [ -n "$FEATURES" ]; then
                      echo "### ✨ New Features"
                      echo ""
                      echo "$FEATURES"
                    fi

                    if [ -n "$FIXES" ]; then
                      echo "### 🐛 Bug Fixes"
                      echo ""
                      echo "$FIXES"
                    fi

                    if [ -n "$IMPROVEMENTS" ]; then
                      echo "### 🔧 Improvements & Maintenance"
                      echo ""
                      echo "$IMPROVEMENTS"
                    fi

                    if [ -n "$OTHER" ]; then
                      echo "### 📝 Other Changes"
                      echo ""
                      echo "$OTHER"
                    fi

                    if [ "$TOTAL" -eq 0 ]; then
                      echo "### 📋 Changes"
                      echo ""
                      echo "- Initial release or no conventional commits found."
                      echo ""
                    fi

                    echo "---"
                    echo ""
                    echo "## 📦 Installation"
                    echo ""
                    echo "###  macOS"
                    echo "1. Download the \`.dmg\` file matching your chip:"
                    echo "   - **Apple Silicon (M1/M2/M3):** \`T.R.E-Assistant-*-arm64.dmg\`"
                    echo "   - **Intel Mac:** \`T.R.E-Assistant-*-x64.dmg\`"
                    echo "2. Open the \`.dmg\` and drag **T.R.E Assistant** to your **Applications** folder."
                    echo "3. On first launch, right-click → **Open** to bypass Gatekeeper if needed."
                    echo ""
                    echo "### ⊞ Windows"
                    echo "1. Download \`T.R.E-Assistant-*-x64-Setup.exe\`."
                    echo "2. Run the installer and follow the setup wizard."
                    echo "3. You can choose a custom installation directory during setup."
                    echo ""
                    echo "---"
                    echo ""
                    if [ -n "$PREV_TAG" ]; then
                      echo "**📜 Full Changelog:** [${PREV_TAG} → ${CURRENT_TAG}](${COMPARE_URL})"
                    else
                      echo "**📜 Full Changelog:** [View all commits](https://github.com/${{ github.repository }}/commits/${CURRENT_TAG})"
                    fi
                    echo "ENDOFBODY"
                  } >> "$GITHUB_OUTPUT"

                  echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_OUTPUT"
                  echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

            - name: Package Chrome Extension
              shell: bash
              run: |
                  zip -r tre-assistant-chrome-extension.zip chrome-extension/
                  echo "Chrome extension packaged: $(du -sh tre-assistant-chrome-extension.zip | cut -f1)"

            - name: Create GitHub Release
              id: create_release
              uses: softprops/action-gh-release@v2
              with:
                  name: "T.R.E Assistant ${{ steps.notes.outputs.CURRENT_TAG }}"
                  body: ${{ steps.notes.outputs.RELEASE_BODY }}
                  draft: false
                  prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
                  files: tre-assistant-chrome-extension.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ─────────────────────────────────────────────
    # macOS builds (Apple signing + notarization)
    # ─────────────────────────────────────────────
    build-mac:
        needs: create-release
        strategy:
            matrix:
                include:
                    - arch: arm64
                      cmd: npx electron-builder --mac --arm64 --publish always
                    - arch: x64
                      cmd: npx electron-builder --mac --x64 --publish always

        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Update version in package.json
              shell: bash
              run: |
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  CURRENT=$(node -p "require('./package.json').version")
                  if [ "$CURRENT" != "$VERSION" ]; then
                    echo "Updating package.json from $CURRENT to $VERSION"
                    npm version "$VERSION" --no-git-tag-version
                  else
                    echo "package.json already at version $VERSION, skipping."
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build and publish (macOS)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: false
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: ${{ matrix.cmd }}

    # ─────────────────────────────────────────────
    # Windows build → SignPath signing (free for OSS)
    # ─────────────────────────────────────────────
    build-windows:
        needs: create-release
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Update version in package.json
              shell: bash
              run: |
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  CURRENT=$(node -p "require('./package.json').version")
                  if [ "$CURRENT" != "$VERSION" ]; then
                    echo "Updating package.json from $CURRENT to $VERSION"
                    npm version "$VERSION" --no-git-tag-version
                  else
                    echo "package.json already at version $VERSION, skipping."
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build unsigned Windows installer
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Disable all local signing — SignPath will sign the artifact
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  WIN_CSC_LINK: ""
                  WIN_CSC_KEY_PASSWORD: ""
              run: npx electron-builder --win nsis --x64
              # Note: no --publish here; we upload manually after signing

            - name: Locate unsigned installer
              id: find_installer
              shell: bash
              run: |
                  FILE=$(ls release/*.exe | head -n 1)
                  echo "INSTALLER_PATH=$FILE" >> "$GITHUB_OUTPUT"
                  echo "INSTALLER_NAME=$(basename $FILE)" >> "$GITHUB_OUTPUT"
                  echo "Found: $FILE"

            - name: Upload unsigned installer as workflow artifact
              id: upload_unsigned
              uses: actions/upload-artifact@v4
              with:
                  name: unsigned-windows-installer
                  path: ${{ steps.find_installer.outputs.INSTALLER_PATH }}
                  retention-days: 1

            # ── SignPath.io free signing for open source ──────────────────
            # Prerequisites (one-time setup):
            #   1. Register at https://signpath.io → choose "Open Source" free plan
            #   2. Link your GitHub repo in the SignPath project settings
            #   3. Create a project slug: "tre-assistant"
            #   4. Create a signing policy slug: "release-signing"
            #   5. Create artifact config slug: "windows-installer"
            #   6. Add SIGNPATH_API_TOKEN & SIGNPATH_ORGANIZATION_ID as repo secrets
            # See: docs/windows-signing-setup.md for detailed instructions
            # ─────────────────────────────────────────────────────────────
            - name: Sign installer via SignPath.io
              id: sign
              uses: signpath/github-action-submit-signing-request@v1
              with:
                  api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
                  organization-id: "${{ secrets.SIGNPATH_ORGANIZATION_ID }}"
                  project-slug: "tre-assistant"
                  signing-policy-slug: "release-signing"
                  artifact-configuration-slug: "windows-installer"
                  github-artifact-id: "${{ steps.upload_unsigned.outputs.artifact-id }}"
                  wait-for-completion: true
                  output-artifact-directory: "release-signed"

            - name: Upload signed installer to GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  SIGNED_FILE=$(ls release-signed/*.exe | head -n 1)
                  echo "Uploading signed installer: $SIGNED_FILE"
                  gh release upload "$TAG" "$SIGNED_FILE" --clobber
