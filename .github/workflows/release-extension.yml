name: Release Chrome Extension

on:
    push:
        tags:
            - "ext-v*"

permissions:
    contents: write

jobs:
    build-chrome-extension:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Package Chrome Extension as ZIP
              shell: bash
              run: |
                  zip -r viezan-chrome-extension.zip chrome-extension \
                    --exclude "chrome-extension/chrome-extension.pem" \
                    --exclude "chrome-extension/README.md"
                  echo "Chrome extension zipped: $(du -sh viezan-chrome-extension.zip | cut -f1)"

            - name: Upload Chrome Extension to Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Tag format: ext-v1.1.1 → derive app release tag: v1.1.1
                  EXT_TAG="${GITHUB_REF#refs/tags/}"
                  APP_TAG="${EXT_TAG#ext-}"

                  echo "Extension tag : $EXT_TAG"
                  echo "App release tag: $APP_TAG"

                  # Check if a release with the app tag already exists
                  if gh release view "$APP_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                    echo "Release $APP_TAG found — uploading .zip (replace existing)"
                    gh release upload "$APP_TAG" viezan-chrome-extension.zip --clobber
                  else
                    echo "Release $APP_TAG not found — creating new release for $EXT_TAG"
                    gh release create "$EXT_TAG" viezan-chrome-extension.zip \
                      --title "Viezan Chrome Extension $APP_TAG" \
                      --notes "Chrome Extension update for Viezan $APP_TAG" \
                      --repo "$GITHUB_REPOSITORY"
                  fi
