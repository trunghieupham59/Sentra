name: Build Windows Sample (for SignPath setup)

# ─────────────────────────────────────────────────────────────────────────────
# Chạy workflow này để lấy file mẫu (.exe, .dll) upload lên SignPath
# dashboard khi cấu hình Artifact Configuration.
#
# Cách dùng:
#   GitHub repo → Actions → "Build Windows Sample" → Run workflow
#
# Sau khi chạy xong:
#   1. Vào Actions run → Artifacts → download "windows-sample-bundle"
#   2. Upload file zip này lên SignPath → Artifact Configurations → Generate from sample
# ─────────────────────────────────────────────────────────────────────────────
on:
    workflow_dispatch: # Chỉ chạy khi trigger thủ công

jobs:
    build-sample:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build app
              run: npm run build

            - name: Build unsigned Windows installer
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  WIN_CSC_LINK: ""
                  WIN_CSC_KEY_PASSWORD: ""
              run: npx electron-builder --win nsis --x64 --publish never

            - name: Package sample bundle (installer + EXE + DLL)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path sample-bundle | Out-Null

                  Write-Host "=== NSIS Installer ==="
                  Copy-Item release\*.exe sample-bundle\
                  Get-ChildItem release\*.exe | Select-Object Name, Length

                  Write-Host ""
                  Write-Host "=== App PE files (win-unpacked) ==="
                  if (Test-Path release\win-unpacked) {
                    Get-ChildItem -Path release\win-unpacked -Filter *.exe | Copy-Item -Destination sample-bundle\
                    Get-ChildItem -Path release\win-unpacked -Filter *.dll | Copy-Item -Destination sample-bundle\
                    Write-Host "Files copied:"
                    Get-ChildItem sample-bundle | Select-Object Name, Length
                  }

                  Write-Host ""
                  Write-Host "=== Creating flat ZIP (files at root, no subdirectory) ==="
                  # Must cd into the folder so Compress-Archive stores files at ZIP root
                  Push-Location sample-bundle
                  Compress-Archive -Path * -DestinationPath ..\windows-sample-bundle.zip -Force
                  Pop-Location
                  $size = (Get-Item windows-sample-bundle.zip).Length / 1MB
                  $count = (Get-ChildItem sample-bundle).Count
                  Write-Host "Total files: $count"
                  Write-Host "Bundle size: $([math]::Round($size, 2)) MB"

            - name: Upload sample bundle as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows-sample-bundle
                  path: windows-sample-bundle.zip
                  retention-days: 7
