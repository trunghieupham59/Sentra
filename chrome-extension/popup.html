<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viezan Translate</title>
  <link rel="stylesheet" href="extension-ui.css" />
</head>
<body class="popup-page">

  <div class="not-connected" id="not-connected-state" style="display:none">
    <div class="not-connected-card">
      <div class="not-connected-mark" aria-hidden="true">!</div>
      <div>
        <div class="not-connected-title">Viezan is not connected</div>
        <p class="not-connected-text">Paste the connection API key from the desktop app before translating in the browser.</p>
      </div>
      <button type="button" class="button button-primary" id="btn-go-options">
        Open Options
      </button>
    </div>
  </div>

  <div class="popup-shell" id="connected-state" style="display:none">
    <header class="popup-header">
      <div class="brand-mark">
        <img src="icons/icon128.png" alt="Viezan" />
      </div>
      <div class="brand-copy">
        <div class="brand-title">Viezan</div>
        <div class="brand-subtitle">Browser translate</div>
      </div>
      <div class="status-pill" id="status-badge">
        <span class="status-dot loading" id="status-dot"></span>
        <span id="status-label">Connecting...</span>
      </div>
      <div class="header-spacer"></div>
      <button type="button" class="button button-ghost" id="btn-options">
        Options
      </button>
    </header>

    <section class="popup-controls" aria-label="Translation controls">
      <div class="model-stack">
        <span class="meta-badge ctrl-badge-loading" id="ctrl-provider">Provider</span>
        <span class="meta-badge ctrl-badge-model ctrl-badge-loading" id="ctrl-model">Model</span>
      </div>
      <div class="select-field">
        <label for="target-lang">To</label>
        <select class="control-select" id="target-lang">
          <option value="en">English</option>
          <option value="vi">Vietnamese</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="zh-TW">Chinese (Traditional)</option>
          <option value="ko">Korean</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="ar">Arabic</option>
          <option value="th">Thai</option>
          <option value="id">Indonesian</option>
          <option value="it">Italian</option>
          <option value="nl">Dutch</option>
          <option value="tr">Turkish</option>
          <option value="hi">Hindi</option>
        </select>
      </div>
      <div class="select-field">
        <label for="translation-style">Style</label>
        <select class="control-select" id="translation-style">
          <option value="general">General</option>
          <option value="formal">Formal</option>
          <option value="casual">Casual</option>
          <option value="business">Business</option>
          <option value="technical">Technical</option>
          <option value="natural">Natural</option>
        </select>
      </div>
    </section>

    <main class="popup-body">
      <section class="text-panel panel-source" aria-labelledby="source-label">
        <div class="panel-label" id="source-label">Original</div>
        <textarea class="source-textarea" id="input-text" placeholder="Paste or type text here..."></textarea>
      </section>
      <div class="panel-divider" aria-hidden="true"></div>
      <section class="text-panel panel-result" aria-labelledby="result-label">
        <div class="panel-label" id="result-label">Translation</div>
        <div class="result-text" id="result-text">
          <span class="result-placeholder">Translation appears here...</span>
        </div>
      </section>
    </main>

    <footer class="popup-footer">
      <div class="footer-left">
        <button type="button" class="button button-ghost" id="btn-clear">
          <span class="button-glyph" aria-hidden="true">x</span>
          Clear
        </button>
        <button type="button" class="button button-primary" id="btn-translate">
          <span class="button-glyph" aria-hidden="true">></span>
          Translate
        </button>
      </div>
      <div class="footer-right" id="footer-result" style="display:none">
        <button type="button" class="button button-media" id="btn-speak-result">
          Listen
        </button>
        <button type="button" class="button button-soft" id="btn-copy-result">
          Copy
        </button>
        <button type="button" class="button button-success" id="btn-replace">
          Replace
        </button>
      </div>
    </footer>

    <div class="statusbar" id="status-msg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
