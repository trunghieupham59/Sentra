<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T.R.E Assistant Translate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 13px;
      background: #f8f9ff;
      color: #1e1b4b;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 13px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 100px; height: 100px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -20px; left: 60px;
      width: 70px; height: 70px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .header-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .header-logo img { width: 32px; height: 32px; display: block; }
    .header-text { position: relative; z-index: 1; }
    .header-title { font-weight: 800; font-size: 14px; color: #fff; letter-spacing: -0.2px }
    .header-subtitle { font-size: 10px; color: rgba(255,255,255,0.75); margin-top: 1px }
    .header-settings {
      margin-left: auto;
      padding: 5px 10px;
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(8px);
    }
    .header-settings:hover { background: rgba(255,255,255,0.28); }

    /* ── Sections ── */
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #e8eeff;
      background: #fff;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #4f46e5;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    select, textarea {
      width: 100%;
      background: #f8f9ff;
      border: 1.5px solid #dde3ff;
      border-radius: 9px;
      color: #1e1b4b;
      font-size: 13px;
      font-family: inherit;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    select:focus, textarea:focus {
      border-color: #4f46e5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
    }
    select { appearance: none; padding-right: 28px; cursor: pointer }

    .select-wrap { position: relative }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #6366f1;
      pointer-events: none;
      font-size: 12px;
    }

    textarea {
      resize: none;
      height: 80px;
      line-height: 1.55;
      font-size: 13px;
    }
    textarea::placeholder { color: #b8c0f0; }

    /* ── Button row ── */
    .btn-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e8eeff;
    }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.01em;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      color: #fff;
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.30);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #5b21b6);
      box-shadow: 0 5px 14px rgba(79, 70, 229, 0.40);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none }

    .btn-secondary {
      background: #f0f4ff;
      color: #4f46e5;
      border: 1.5px solid #dde3ff;
    }
    .btn-secondary:hover { background: #e0e7ff; border-color: #c7d2fe; }

    /* ── Result box ── */
    .result-box {
      margin: 12px 16px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      border-radius: 12px;
      border: 1.5px solid #c7d2fe;
      display: none;
    }
    .result-label {
      font-size: 10px;
      color: #6366f1;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .result-label::before { content: '✦'; font-size: 8px; }
    .result-text {
      color: #1e1b4b;
      line-height: 1.6;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .result-actions {
      display: flex;
      gap: 6px;
    }
    .result-actions .btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      border-radius: 7px;
    }
    .btn-copy-result {
      background: #fff;
      color: #4f46e5;
      border: 1.5px solid #c7d2fe;
    }
    .btn-copy-result:hover { background: #eef2ff; }
    .btn-copy-result.copied {
      background: #f0fdf4;
      color: #065f46;
      border-color: #6ee7b7;
    }
    .btn-replace {
      background: #fff;
      color: #0369a1;
      border: 1.5px solid #bae6fd;
    }
    .btn-replace:hover { background: #f0f9ff; }
    .btn-replace.replaced {
      background: #f0fdf4;
      color: #065f46;
      border-color: #6ee7b7;
    }

    /* ── AI info bar ── */
    .ai-info-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: linear-gradient(90deg, #eef2ff, #f5f3ff);
      border-bottom: 1px solid #dde3ff;
      font-size: 11px;
      color: #4f46e5;
      font-weight: 500;
    }
    .ai-info-bar .ai-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      box-shadow: 0 0 4px rgba(74,222,128,0.6);
    }
    .ai-info-bar .ai-dot.loading {
      background: #fbbf24;
      animation: pulse 1s ease-in-out infinite;
    }
    .ai-info-bar .ai-dot.error { background: #f87171; box-shadow: none; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
    .ai-pill {
      background: #4f46e5;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ai-pill-model {
      background: #0d9488;
      font-family: 'SF Mono', monospace;
    }

    /* ── Status ── */
    .status {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      display: none;
      line-height: 1.4;
    }
    .status.error { color: #be123c; background: #fff1f2; border-top: 1px solid #ffe4e6; }
    .status.success { color: #065f46; background: #f0fdf4; border-top: 1px solid #dcfce7; }
    .status.loading { color: #4f46e5; background: #eef2ff; border-top: 1px solid #e0e7ff; }

    /* ── Not connected ── */
    .not-connected {
      padding: 28px 20px;
      text-align: center;
      background: #fff;
    }
    .not-connected-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .not-connected p {
      color: #6366f1;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.55;
      font-weight: 500;
    }
    .not-connected .btn {
      display: inline-block;
      flex: none;
      padding: 10px 24px;
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.30);
      cursor: pointer;
      border: none;
      font-size: 13px;
    }
    .not-connected .btn:hover {
      background: linear-gradient(135deg, #4338ca, #5b21b6);
    }

    /* ── Bottom padding ── */
    .bottom-pad { height: 4px; background: #fff; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <img src="icons/icon128.png" alt="T.R.E Assistant" />
    </div>
    <div class="header-text">
      <div class="header-title">T.R.E Assistant</div>
      <div class="header-subtitle">AI-powered · via native app</div>
    </div>
    <button type="button" class="header-settings" id="btn-options">⚙ Options</button>
  </div>

  <!-- Not connected state -->
  <div class="not-connected" id="not-connected-state" style="display:none">
    <div class="not-connected-icon">🔌</div>
    <p>Not connected to T.R.E Assistant app.<br>Set your token in Options first.</p>
    <button type="button" id="btn-go-options">Open Options</button>
  </div>

  <!-- Connected state -->
  <div id="connected-state" style="display:none">

    <!-- Active AI provider/model bar -->
    <div class="ai-info-bar" id="ai-info-bar">
      <span class="ai-dot loading" id="ai-dot"></span>
      <span id="ai-info-text">Loading…</span>
    </div>

    <div class="section">
      <label>Translate to</label>
      <div class="select-wrap">
        <select id="target-lang">
          <option value="en">🇬🇧 English</option>
          <option value="vi">🇻🇳 Vietnamese</option>
          <option value="ja">🇯🇵 Japanese</option>
          <option value="zh">🇨🇳 Chinese (Simplified)</option>
          <option value="ko">🇰🇷 Korean</option>
          <option value="fr">🇫🇷 French</option>
          <option value="de">🇩🇪 German</option>
          <option value="es">🇪🇸 Spanish</option>
          <option value="pt">🇵🇹 Portuguese</option>
          <option value="ru">🇷🇺 Russian</option>
          <option value="ar">🇸🇦 Arabic</option>
          <option value="th">🇹🇭 Thai</option>
          <option value="id">🇮🇩 Indonesian</option>
        </select>
      </div>
    </div>

    <div class="section">
      <label>Text to translate</label>
      <textarea id="input-text" placeholder="Paste or type text here…"></textarea>
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" id="btn-clear">✕ Clear</button>
      <button type="button" class="btn btn-primary" id="btn-translate">⚡ Translate</button>
    </div>

    <div class="result-box" id="result-box">
      <div class="result-label">Translation</div>
      <div class="result-text" id="result-text"></div>
      <div class="result-actions">
        <button type="button" class="btn btn-copy-result" id="btn-copy-result">📋 Copy</button>
        <button type="button" class="btn btn-replace" id="btn-replace">↩ Replace</button>
      </div>
    </div>

    <div class="status" id="status-msg"></div>
    <div class="bottom-pad"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
