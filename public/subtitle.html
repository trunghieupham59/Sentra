<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viezan Subtitles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      user-select: none;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    .wrapper {
      display: flex; flex-direction: column;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.65);
    }

    /* ── Handle bar ────────────────────────────────────────────────────────── */
    .handle {
      flex-shrink: 0;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 5px 10px; height: 34px;
      background: rgba(0,0,0,0.88);
      -webkit-app-region: drag;
    }
    .grip  { color: rgba(255,255,255,0.25); font-size: 14px; letter-spacing: 1px; }
    .label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px; color: rgba(255,255,255,0.25); }
    .close-btn {
      -webkit-app-region: no-drag;
      background: none; border: none;
      color: rgba(255,255,255,0.30); cursor: pointer;
      font-size: 12px; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; padding: 0;
      transition: color 0.15s, background 0.15s;
    }
    .close-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }

    /* ── Status badge (in handle bar) ──────────────────────────────────────── */
    .status-badge {
      -webkit-app-region: no-drag;
      display: flex; align-items: center; gap: 4px;
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: color 0.3s, background 0.3s, border-color 0.3s;
    }
    .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    /* Stopped */
    .status-badge.stopped { color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.07); }
    .status-badge.stopped .status-dot { background: rgba(255,255,255,0.25); }
    /* Listening */
    .status-badge.listening { color: #68d391; background: rgba(72,187,120,0.12); border-color: rgba(72,187,120,0.25); }
    .status-badge.listening .status-dot { background: #68d391; animation: pulse-green 1.5s ease-in-out infinite; }
    /* Transcribing */
    .status-badge.transcribing { color: #90cdf4; background: rgba(99,179,237,0.12); border-color: rgba(99,179,237,0.25); }
    .status-badge.transcribing .status-dot { background: #90cdf4; animation: pulse-blue 0.8s ease-in-out infinite; }
    /* Translating */
    .status-badge.translating { color: #f6e05e; background: rgba(246,224,94,0.12); border-color: rgba(246,224,94,0.25); }
    .status-badge.translating .status-dot { background: #f6e05e; animation: pulse-yellow 0.6s ease-in-out infinite; }

    @keyframes pulse-green  { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.7); } }
    @keyframes pulse-blue   { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    @keyframes pulse-yellow { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* ── Controls row 1 ─────────────────────────────────────────────────────── */
    .controls {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; height: 40px;
      background: rgba(0,0,0,0.82);
      border-top: 1px solid rgba(255,255,255,0.07);
      -webkit-app-region: no-drag;
      position: relative;
    }

    /* ── Controls row 2 ─────────────────────────────────────────────────────── */
    .controls2 {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; height: 36px;
      background: rgba(0,0,0,0.80);
      border-top: 1px solid rgba(255,255,255,0.05);
      -webkit-app-region: no-drag;
    }

    /* ── Provider dropdown ───────────────────────────────────────────────────── */
    .provider-dropdown { position: relative; flex-shrink: 0; }
    .provider-btn {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 5px; color: rgba(255,255,255,0.80);
      font-size: 11px; padding: 3px 7px 3px 5px; height: 28px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s;
    }
    .provider-btn:hover { background: rgba(255,255,255,0.13); }
    .provider-btn .caret { color: rgba(255,255,255,0.40); font-size: 9px; margin-left: 1px; }
    .provider-menu {
      display: none; position: absolute;
      top: calc(100% + 4px); left: 0;
      background: #1e1e2e;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px; padding: 4px;
      min-width: 130px; z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .provider-menu.open { display: block; }
    .provider-option {
      display: flex; align-items: center; gap: 7px;
      width: 100%; background: none; border: none;
      color: rgba(255,255,255,0.80); font-size: 11px;
      padding: 5px 8px; border-radius: 5px;
      cursor: pointer; text-align: left;
      transition: background 0.12s;
    }
    .provider-option:hover { background: rgba(255,255,255,0.10); }
    .provider-option.active { background: rgba(255,255,255,0.08); color: #fff; }

    /* ── Selectors ───────────────────────────────────────────────────────────── */
    .sel {
      flex: 1; min-width: 0;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 5px; color: rgba(255,255,255,0.80);
      font-size: 11px; padding: 3px 5px;
      height: 28px; cursor: pointer; outline: none;
    }
    .sel:hover { background: rgba(255,255,255,0.13); }
    .sel option { background: #1a1a2e; color: #fff; }

    /* ── Start/Stop ──────────────────────────────────────────────────────────── */
    .start-btn {
      flex-shrink: 0;
      background: rgba(72,187,120,0.18);
      border: 1px solid rgba(72,187,120,0.35);
      border-radius: 5px; color: #68d391;
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; height: 28px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .start-btn:hover { background: rgba(72,187,120,0.28); }
    .start-btn.active { background: rgba(252,129,74,0.18); border-color: rgba(252,129,74,0.35); color: #fc8d5a; }
    .start-btn.active:hover { background: rgba(252,129,74,0.28); }

    /* ── New session button ───────────────────────────────────────────────────── */
    .new-btn {
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 5px; color: rgba(255,255,255,0.45);
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; height: 28px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .new-btn:hover { background: rgba(255,100,100,0.15); border-color: rgba(255,100,100,0.30); color: #fc8d8d; }

    /* ── Audio mode buttons (SVG icons) ──────────────────────────────────────── */
    .audio-group { display: flex; gap: 3px; flex-shrink: 0; }
    .audio-btn {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 4px; color: rgba(255,255,255,0.50);
      font-size: 10px; padding: 2px 7px; height: 24px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .audio-btn svg { flex-shrink: 0; }
    .audio-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.80); }
    .audio-btn.active {
      background: rgba(99,179,237,0.20);
      border-color: rgba(99,179,237,0.40);
      color: #90cdf4;
    }
    .ctrl-label { font-size: 9px; color: rgba(255,255,255,0.30); white-space: nowrap; flex-shrink: 0; }

    /* ── Language selector ───────────────────────────────────────────────────── */
    .lang-sel {
      flex: 1; min-width: 0;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 4px; color: rgba(255,255,255,0.75);
      font-size: 10px; padding: 2px 5px;
      height: 24px; cursor: pointer; outline: none;
    }
    .lang-sel:hover { background: rgba(255,255,255,0.12); }
    .lang-sel option { background: #1a1a2e; color: #fff; }

    /* ── Content area ────────────────────────────────────────────────────────── */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-end;
      padding: 8px 18px 10px;
      min-height: 0; overflow-y: auto;
      background: rgba(0,0,0,0.84);
      transition: background 0.2s;
      -webkit-app-region: no-drag;
    }
    .subtitle-list {
      width: 100%;
      display: flex; flex-direction: column;
      gap: 6px;
    }
    .subtitle-entry {
      width: 100%;
    }
    .source-text {
      display: none;
      color: rgba(255,255,255,0.38); font-size: 12px;
      font-style: italic; line-height: 1.4; word-break: break-word;
      margin-bottom: 3px;
      text-align: left;
    }
    .tx-text {
      display: block; width: 100%;
      color: #fff; font-size: 18px; font-weight: 600;
      text-align: left; line-height: 1.45;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95);
      word-break: break-word;
      transition: color 0.2s, font-size 0.15s;
    }
    .tx-text.history {
      opacity: 0.45;
      font-size: 0.85em;
    }
    .source-text.history {
      opacity: 0.45;
    }
    .placeholder { color: rgba(255,255,255,0.20); font-size: 13px; font-style: italic; text-align: left; }

    /* ── Style bar ───────────────────────────────────────────────────────────── */
    .style-bar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; height: 36px;
      background: rgba(0,0,0,0.82);
      border-top: 1px solid rgba(255,255,255,0.07);
      -webkit-app-region: no-drag;
    }
    .style-label { font-size: 10px; color: rgba(255,255,255,0.35); white-space: nowrap; }
    input[type="color"] {
      -webkit-appearance: none; width: 20px; height: 20px;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      padding: 0; cursor: pointer; background: none; flex-shrink: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
    .slider-group { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    input[type="range"] {
      -webkit-appearance: none; flex: 1; min-width: 0; height: 3px;
      background: rgba(255,255,255,0.15); border-radius: 2px;
      outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.70); cursor: pointer;
    }
    input[type="range"]:hover::-webkit-slider-thumb { background: #fff; }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- ── Handle bar ─────────────────────────────────────────────────────── -->
    <div class="handle">
      <span class="grip">⠿⠿</span>
      <span class="label">Subtitles · Viezan</span>
      <!-- Status badge -->
      <div class="status-badge stopped" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Đã dừng</span>
      </div>
      <button type="button" class="close-btn" id="closeBtn" title="Đóng subtitles">✕</button>
    </div>

    <!-- ── Controls row 1: Provider / Model / Start-Stop ──────────────────── -->
    <div class="controls">
      <!-- Custom provider dropdown with real SVG icons -->
      <div class="provider-dropdown" id="providerDropdown">
        <button type="button" class="provider-btn" id="providerBtn">

              <path d="M2 10.5C5.5 10.8 8.8 10.2 10.5 8C12.2 10.2 15.5 10.8 19 10.5C15.5 10.2 12.2 11.8 10.5 14C8.8 11.8 5.5 10.2 2 10.5Z" fill="#1A73E8" opacity="0.5"/>

              <path d="M12 7L15.46 9V13L12 15L8.54 13V9L12 7Z" fill="#10A37F"/>

            OpenAI
          </button>
        </div>
      </div>
      <select id="modelSel" class="sel" title="Chọn Model"></select>
      <button type="button" id="startStopBtn" class="start-btn">▶ Bắt đầu</button>
      <button type="button" id="newSessionBtn" class="new-btn" title="Phiên mới — lưu phiên hiện tại vào lịch sử">＋ Mới</button>
    </div>

    <!-- ── Controls row 2: Audio Mode / Target Language ───────────────────── -->
    <div class="controls2">
      <span class="ctrl-label">Nguồn</span>
      <div class="audio-group">
        <!-- MicrophoneIcon SVG from media.tsx -->
        <button type="button" class="audio-btn" data-mode="mic" title="Microphone">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round"/>
            <line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round"/>
          </svg>
          <span style="opacity:0.5;font-size:8px">+</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path stroke-linecap="round" d="M8 21h8M12 17v4"/>

      </div>
      <span class="ctrl-label">Dịch sang</span>
      <select id="langSel" class="lang-sel" title="Ngôn ngữ đích"></select>
    </div>

    <!-- ── Content area ───────────────────────────────────────────────────── -->
    <div class="body" id="body">
      <span class="placeholder" id="ph">Chờ bản dịch…</span>
      <div class="subtitle-list" id="subtitleList"></div>
    </div>

    <!-- ── Style bar ──────────────────────────────────────────────────────── -->
    <div class="style-bar">
      <span class="style-label">Màu</span>
      <input type="color" id="colorPicker" value="#ffffff" title="Màu chữ">
      <div class="slider-group">
        <span class="style-label">Mờ</span>
        <input type="range" id="opacitySlider" min="0" max="100" value="84" title="Độ trong mờ nền">
      </div>
      <div class="slider-group">
        <span class="style-label">Aa</span>
        <input type="range" id="fontSizeSlider" min="12" max="40" value="18" title="Cỡ chữ">
      </div>
    </div>

  </div>

  <script>
    // ── Provider SVG icons ────────────────────────────────────────────────────
    const PROVIDER_ICONS = {

    const PROVIDER_NAMES = { gemini: 'Gemini', claude: 'Claude', openai: 'OpenAI' }

    // Fallback model lists
    const FALLBACK_MODELS = {

      ],
      claude: [
        { id: 'claude-3-5-haiku-20241022', name: '3.5 Haiku' },
        { id: 'claude-3-5-sonnet-20241022', name: '3.5 Sonnet' },
        { id: 'claude-3-7-sonnet-20250219', name: '3.7 Sonnet' },
      ],
      openai: [
        { id: 'gpt-4o-mini', name: 'GPT-4o Mini' },
        { id: 'gpt-4o', name: 'GPT-4o' },
        { id: 'gpt-3.5-turbo', name: 'GPT-3.5' },
      ],
    }

    // Target languages
    const TARGET_LANGUAGES = [
      { code: 'vi',    name: 'Tiếng Việt' },
      { code: 'en',    name: 'English' },
      { code: 'zh',    name: '中文 (简体)' },
      { code: 'zh-TW', name: '繁體中文' },
      { code: 'ja',    name: '日本語' },
      { code: 'ko',    name: '한국어' },
      { code: 'fr',    name: 'Français' },
      { code: 'de',    name: 'Deutsch' },
      { code: 'es',    name: 'Español' },
      { code: 'pt',    name: 'Português' },
      { code: 'ru',    name: 'Русский' },
      { code: 'ar',    name: 'العربية' },
      { code: 'th',    name: 'ภาษาไทย' },
      { code: 'id',    name: 'Bahasa Indonesia' },
      { code: 'it',    name: 'Italiano' },
      { code: 'nl',    name: 'Nederlands' },
      { code: 'pl',    name: 'Polski' },
      { code: 'tr',    name: 'Türkçe' },
      { code: 'hi',    name: 'हिंदी' },
    ]

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const closeBtn      = document.getElementById('closeBtn')
    const providerBtn   = document.getElementById('providerBtn')
    const providerIcon  = document.getElementById('providerIcon')
    const providerName  = document.getElementById('providerName')
    const providerMenu  = document.getElementById('providerMenu')
    const modelSel      = document.getElementById('modelSel')
    const startStopBtn  = document.getElementById('startStopBtn')
    const langSel       = document.getElementById('langSel')
    const statusBadge   = document.getElementById('statusBadge')
    const statusText    = document.getElementById('statusText')
    const ph            = document.getElementById('ph')
    const subtitleList  = document.getElementById('subtitleList')
    const body          = document.getElementById('body')
    const colorPicker   = document.getElementById('colorPicker')
    const opacitySlider = document.getElementById('opacitySlider')
    const fontSizeSlider= document.getElementById('fontSizeSlider')
    const audioBtns     = document.querySelectorAll('.audio-btn')

    // ── State ─────────────────────────────────────────────────────────────────
    let currentProvider        = 'gemini'
    let isSessionActive        = false
    let streamText             = ''
    let lastFinalizedText      = ''    // text of the last completed entry (for dedup)
    let isStreaming            = false // true between onStreamStart and onStreamEnd
    // ── Per-segment entry tracking ────────────────────────────────────────────
    // entriesBySegId: segId → { entry, srcEl, txEl }
    // Entries are created IMMEDIATELY when source text arrives, before translation.
    const entriesBySegId        = {}
    let currentStreamEntry      = null   // the entry currently being streamed into
    let currentStreamSegId      = null   // segId of the current stream
    const pendingTranslationQueue = []   // ordered segIds waiting for non-streaming translation

    // ── Populate language dropdown ─────────────────────────────────────────────
    TARGET_LANGUAGES.forEach(l => {
      const opt = document.createElement('option')
      opt.value = l.code; opt.textContent = l.name
      langSel.appendChild(opt)
    })
    langSel.value = 'vi'

    // ── Status badge ──────────────────────────────────────────────────────────
    function updateStatus(isActive, isTranscribing, isTranslating) {
      statusBadge.className = 'status-badge'
      if (!isActive) {
        statusBadge.classList.add('stopped')
        statusText.textContent = 'Đã dừng'
      } else if (isTranslating) {
        statusBadge.classList.add('translating')
        statusText.textContent = 'Đang dịch…'
      } else if (isTranscribing) {
        statusBadge.classList.add('transcribing')
        statusText.textContent = 'Nhận diện…'
      } else {
        statusBadge.classList.add('listening')
        statusText.textContent = 'Đang nghe'
      }
    }

    // ── Provider helpers ───────────────────────────────────────────────────────
    function setProviderUI(id) {
      currentProvider = id
      providerIcon.innerHTML = PROVIDER_ICONS[id] ?? ''
      providerName.textContent = PROVIDER_NAMES[id] ?? id
      document.querySelectorAll('.provider-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id)
      })
    }
    function populateModels(models, selectedId) {
      const list = models && models.length > 0 ? models : (FALLBACK_MODELS[currentProvider] ?? [])
      modelSel.innerHTML = ''
      list.forEach(m => {
        const opt = document.createElement('option')
        opt.value = m.id; opt.textContent = m.name ?? m.id
        modelSel.appendChild(opt)
      })
      if (selectedId) {
        modelSel.value = selectedId
        if (!modelSel.value && list.length > 0) modelSel.value = list[0].id
      }
    }

    setProviderUI('gemini')
    populateModels(null, null)

    // ── Provider dropdown ──────────────────────────────────────────────────────
    providerBtn.onclick = (e) => { e.stopPropagation(); providerMenu.classList.toggle('open') }
    document.addEventListener('click', () => providerMenu.classList.remove('open'))
    providerMenu.addEventListener('click', e => e.stopPropagation())
    document.querySelectorAll('.provider-option').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id
        setProviderUI(id); populateModels(null, null)
        providerMenu.classList.remove('open')
        window.subtitleAPI.emitSetProvider(id)
        if (modelSel.value) window.subtitleAPI.emitSetModel(modelSel.value)
      }
    })

    modelSel.onchange = () => window.subtitleAPI.emitSetModel(modelSel.value)

    // ── Audio mode ─────────────────────────────────────────────────────────────
    function setAudioModeUI(mode) {
      audioBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode))
    }
    audioBtns.forEach(btn => {
      btn.onclick = () => { setAudioModeUI(btn.dataset.mode); window.subtitleAPI.emitSetAudioMode(btn.dataset.mode) }
    })

    langSel.onchange = () => window.subtitleAPI.emitSetTargetLang(langSel.value)

    // ── Start / Stop ───────────────────────────────────────────────────────────
    startStopBtn.onclick = () => {
      if (isSessionActive) window.subtitleAPI.emitStop()
      else window.subtitleAPI.emitStart()
    }
    function updateStartStopBtn() {
      startStopBtn.textContent = isSessionActive ? '⏹ Dừng' : '▶ Bắt đầu'
      startStopBtn.classList.toggle('active', isSessionActive)
    }

    closeBtn.onclick = () => window.subtitleAPI.close()

    // ── New session / clear ─────────────────────────────────────────────────────
    function clearSubtitleList() {
      subtitleList.innerHTML = ''
      // Clear all segment tracking state
      for (const k of Object.keys(entriesBySegId)) delete entriesBySegId[k]
      pendingTranslationQueue.length = 0
      currentStreamEntry = null
      currentStreamSegId = null
      lastFinalizedText  = ''
      streamText         = ''
      isStreaming        = false
      ph.style.display   = 'block'
      ph.textContent     = 'Chờ bản dịch…'
    }
    document.getElementById('newSessionBtn').onclick = () => {
      window.subtitleAPI.emitClear()   // → handleNewSession: save to history then reset
      clearSubtitleList()              // clear subtitle window display
    }

    // ── Text helpers ───────────────────────────────────────────────────────────
    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

    function scrollToBottom() {
      body.scrollTop = body.scrollHeight
    }

    function trimHistory() {
      // Keep ALL entries — user can scroll up to see history.
      // Mark all but the LAST entry as dimmed history.
      const all = subtitleList.querySelectorAll('.subtitle-entry')
      all.forEach((entry, i) => {
        const isLast = i === all.length - 1
        entry.querySelectorAll('.tx-text').forEach(el => el.classList.toggle('history', !isLast))
        entry.querySelectorAll('.source-text').forEach(el => el.classList.toggle('history', !isLast))
      })
    }

    /**
     * Create a subtitle entry immediately when source text arrives.
     * Shows the source text above and a "Đang dịch…" placeholder below.
     * Registers the entry in entriesBySegId for later translation fill-in.
     */
    function createEntryForSeg(sourceText, segId) {
      const entry = document.createElement('div')
      entry.className = 'subtitle-entry'

      const srcEl = document.createElement('div')
      srcEl.className = 'source-text'
      if (sourceText) {
        srcEl.textContent = sourceText
        srcEl.style.display = 'block'
      }

      const txEl = document.createElement('div')
      txEl.className = 'tx-text'
      txEl.style.color = colorPicker.value
      txEl.style.fontSize = fontSizeSlider.value + 'px'
      // Show placeholder while waiting for translation
      txEl.style.opacity = '0.35'
      txEl.textContent = 'Đang dịch…'

      entry.appendChild(srcEl)
      entry.appendChild(txEl)
      subtitleList.appendChild(entry)

      const entryData = { entry, srcEl, txEl }
      if (segId) {
        entriesBySegId[segId] = entryData
        pendingTranslationQueue.push(segId)
      }

      ph.style.display = 'none'
      trimHistory()
      scrollToBottom()
      return entryData
    }

    // ── Style helpers ──────────────────────────────────────────────────────────
    function applyStyle({ textColor, fontSize, bgOpacity }) {
      // Apply color & size to ALL entries (current + history)
      subtitleList.querySelectorAll('.tx-text').forEach(el => {
        el.style.color = textColor
        el.style.fontSize = fontSize + 'px'
      })
      body.style.background = `rgba(0,0,0,${(bgOpacity/100).toFixed(2)})`
      colorPicker.value = textColor; fontSizeSlider.value = fontSize; opacitySlider.value = bgOpacity
    }
    let styleTimer = null
    function emitStyle() {
      clearTimeout(styleTimer)
      styleTimer = setTimeout(() => {
        const s = { textColor: colorPicker.value, fontSize: Number(fontSizeSlider.value), bgOpacity: Number(opacitySlider.value) }
        applyStyle(s); window.subtitleAPI.emitStyleUpdate(s)
      }, 80)
    }
    colorPicker.oninput = opacitySlider.oninput = fontSizeSlider.oninput = emitStyle

    // ── IPC listeners ──────────────────────────────────────────────────────────

    window.subtitleAPI.onState(({ selectedProvider, selectedModel, isActive, isTranscribing, isTranslating, availableModels, audioMode, targetLang }) => {
      if (selectedProvider !== currentProvider) setProviderUI(selectedProvider)
      populateModels(availableModels, selectedModel)
      setAudioModeUI(audioMode || 'system')
      if (targetLang && langSel.value !== targetLang) langSel.value = targetLang
      isSessionActive = isActive
      updateStartStopBtn()
      updateStatus(isActive, isTranscribing, isTranslating)
    })

    // Source text arrives BEFORE translation starts → create entry immediately with placeholder
    window.subtitleAPI.onSourceText(({ text, segId }) => {
      if (!text) return
      createEntryForSeg(text, segId)
    })

    window.subtitleAPI.onStyle((style) => applyStyle(style))

    // ── Overlap deduplication ──────────────────────────────────────────────────
    function stripOverlap(prev, curr) {
      if (!prev || !curr) return curr
      const p = prev.trim()
      const c = curr.trim()

      // Case 1: new text is a pure duplicate (or subset) of the previous entry
      if (p === c || p.includes(c)) return null   // null = discard

      // Case 2: new text STARTS WITH the entire previous entry
      // (e.g. prev = "Bạn cần gọi cho ai?" and curr = "Bạn cần gọi cho ai? Tôi cần…")
      // Also handle joined-without-space: "Prev sentence.Next sentence"
      if (c.startsWith(p)) {
        const remainder = c.substring(p.length).replace(/^[\s,.!?。！？]+/, '').trim()
        return remainder || null   // null if nothing meaningful remains
      }

      // Case 2b: joined without space — prev ends with a word and curr starts with it
      // e.g. prev = "...gọi cho ai?" curr = "gọi cho ai?Tôi cần..."
      const pNoPunct = p.replace(/[,.!?。！？\s]+$/, '')
      if (pNoPunct.length >= 8 && c.startsWith(pNoPunct)) {
        const remainder = c.substring(pNoPunct.length).replace(/^[\s,.!?。！？]+/, '').trim()
        return remainder || null
      }

      // Case 3: partial suffix-of-prev is a prefix-of-curr (sliding window overlap)
      // Try progressively shorter suffixes of prev (min 8 chars to avoid false positives)
      const minLen = Math.max(8, Math.floor(p.length * 0.25))
      for (let len = Math.min(p.length, c.length); len >= minLen; len--) {
        const suffix = p.slice(-len)
        if (c.startsWith(suffix)) {
          const remainder = c.substring(len).replace(/^[\s,.!?。！？]+/, '').trim()
          return remainder || null
        }
      }

      return curr   // no overlap — keep as-is
    }

    // Streaming
    // ── Streaming path ─────────────────────────────────────────────────────────
    window.subtitleAPI.onStreamStart(({ segId }) => {
      isStreaming = true
      streamText = ''
      currentStreamSegId = segId || null

      // Find the entry pre-created by onSourceText; fall back to creating a new one
      const entryData = segId ? entriesBySegId[segId] : null
      if (entryData) {
        currentStreamEntry = entryData
        currentStreamEntry.txEl.textContent = ''      // clear placeholder
        currentStreamEntry.txEl.style.opacity = '1'
      } else {
        // onSourceText hasn't arrived yet — create entry now without source text
        currentStreamEntry = createEntryForSeg('', segId)
        currentStreamEntry.txEl.textContent = ''
        currentStreamEntry.txEl.style.opacity = '1'
      }
    })

    window.subtitleAPI.onStreamToken((token) => {
      streamText += token
      if (currentStreamEntry) {
        currentStreamEntry.txEl.innerHTML = escHtml(streamText)
        scrollToBottom()
      }
    })

    window.subtitleAPI.onStreamEnd(({ segId }) => {
      isStreaming = false

      if (currentStreamEntry) {
        const deduped = stripOverlap(lastFinalizedText, streamText)
        if (deduped === null) {
          // Pure duplicate — remove entry
          subtitleList.removeChild(currentStreamEntry.entry)
          if (currentStreamSegId) delete entriesBySegId[currentStreamSegId]
        } else {
          if (deduped !== streamText) {
            currentStreamEntry.txEl.innerHTML = escHtml(deduped)
          }
          currentStreamEntry.txEl.style.opacity = '1'
          lastFinalizedText = deduped
        }
      }

      // Remove from pending queue
      const idx = pendingTranslationQueue.indexOf(currentStreamSegId)
      if (idx !== -1) pendingTranslationQueue.splice(idx, 1)

      currentStreamEntry = null
      currentStreamSegId = null
      trimHistory()
    })

    // ── Non-streaming fallback ─────────────────────────────────────────────────
    // Fired by the latestSubtitle useEffect in React. Ignored when streaming is active.
    // When streaming fails/isn't used, fills the oldest pending entry's translation.
    window.subtitleAPI.onText(({ text, isTranslating }) => {
      if (isStreaming) return   // stream handles its own entry — ignore
      if (!text) return

      streamText = text

      // Find the oldest entry waiting for a translation
      const oldestSegId = pendingTranslationQueue[0] || null
      const entryData   = oldestSegId ? entriesBySegId[oldestSegId] : null

      if (entryData) {
        const deduped = stripOverlap(lastFinalizedText, text)
        if (deduped === null) {
          subtitleList.removeChild(entryData.entry)
          delete entriesBySegId[oldestSegId]
          pendingTranslationQueue.shift()
        } else {
          entryData.txEl.innerHTML = escHtml(deduped)
          entryData.txEl.style.opacity = '1'
          lastFinalizedText = deduped
          if (!isTranslating) {
            pendingTranslationQueue.shift()
            trimHistory()
          }
        }
      } else {
        // No pending entry — this is a stale latestSubtitle update, ignore
      }
    })
  </script>
</body>
</html>
